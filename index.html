<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multi Toolkit</title>
<!--
  This file exists only for the case where GitHub Pages is publishing the REPO
  ROOT rather than the /docs folder. The real page is docs/index.html; this is a
  pointer to it, not a second copy, so the two can never drift apart.

  Preferred setup: Settings -> Pages -> Source: main branch, /docs folder.
  With that set, this file is never published and does nothing.
-->
<meta http-equiv="refresh" content="0; url=./docs/">
<link rel="canonical" href="./docs/">
<meta name="robots" content="noindex">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;
    justify-content:center;background:#100E0C;color:#EFE9E1;
    font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
  a{color:#7FAECF}
</style>
</head>
<body>
  <p>Taking you to the project page — <a href="./docs/">continue</a>.</p>
  <script>location.replace('./docs/');</script>
</body>
</html>
